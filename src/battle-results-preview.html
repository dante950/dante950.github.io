<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야차 결과 화면 확인</title><link rel="stylesheet" href="__RESULT_CSS__"><style>body{margin:0;background:#000}nav{position:fixed;z-index:1001;top:8px;left:8px;display:flex;gap:6px;opacity:.3}nav:hover,nav:focus-within{opacity:1}nav button{background:#17121b;color:#eee;border:1px solid #675262;padding:5px 8px;font:12px sans-serif}#previewMessage{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:20px;color:#e9dfbc;font:20px sans-serif}#previewMessage button{padding:12px}</style><nav aria-label="결과 시안 선택"><button data-case="victory">승리</button><button data-case="zombie">좀비 패배</button><button data-case="sans">샌즈 패배</button><button data-case="minion">마왕 부하 패배</button></nav><main id="previewMessage"></main><script type="module">
import {showBattleResult} from '__RESULT_JS__';
let stop;const cases={victory:{outcome:'victory'},zombie:{outcome:'defeat',monsterID:10001},sans:{outcome:'defeat',monsterID:10003},minion:{outcome:'defeat',monsterID:10004,canAccept:false}};
function open(name){stop?.();document.getElementById('previewMessage').replaceChildren();stop=showBattleResult({...cases[name],gain:-100,onRetry:()=>done('재도전 선택 · 팔로워 변동 없음',name),onContinue:()=>done(name==='victory'?'승리 확인':'패배 인정 · 팔로워 100명 감소 예시',name)});}
function done(text,name){const host=document.getElementById('previewMessage');host.textContent=text;const b=document.createElement('button');b.textContent='결과 화면 다시 보기';b.onclick=()=>open(name);host.append(b);}
for(const b of document.querySelectorAll('[data-case]'))b.onclick=()=>open(b.dataset.case);
open(new URLSearchParams(location.search).get('case') in cases?new URLSearchParams(location.search).get('case'):'zombie');
</script></html>
