<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>야차차 · 4일차 마왕 방문</title><link rel="stylesheet" href="demon.css"></head><body>
<header><a href="./" id="homeLink">夜叉<span>야차차</span></a><div><b>DAY 04</b><span id="sceneTitle">마지막 손님</span></div><button id="sound">소리 켜짐 ♪</button><button id="replay">처음으로</button></header>
<main><section id="stage" aria-label="마왕 방문 장면"><canvas id="scene" width="960" height="540"></canvas><div id="fade" class="dark"></div><div id="loading" role="status">마왕님을 맞이할 준비를 하고 있습니다…</div>
<div id="lobby" hidden><span class="eyebrow">THE LAST CUSTOMER</span><h1>마지막 손님,<br>마왕.</h1><p>약속한 4일차의 아침입니다.</p><div id="previewSettings"><label for="stars">방문 분기 시험 · 획득한 별</label><select id="stars"><option value="0">별 없음</option><option value="1">★ 1스타</option><option value="2">★★ 2스타</option><option value="3" selected>★★★ 3스타</option></select><small>본편 기록에 영향을 주지 않는 시험입니다.</small></div><button id="open" class="primary">영업 시작</button><details id="beautyShortcuts"><summary>미용 장면만 확인하기</summary><div><button data-preview-phase="1">1 · 투구 복원</button><button data-preview-phase="2">2 · 전투 준비</button><button data-preview-phase="3">3 · 자유 미용</button></div></details></div>
<button id="skip" hidden>컷씬 건너뛰기</button><div id="dialogue" hidden><img id="speakerPortrait" alt=""><div><strong id="speaker"></strong><p id="line" aria-live="polite"></p></div><button id="next" aria-label="다음 대사">F ▸</button></div>
<div id="roomControls" hidden><span>WASD · 방향키 이동 / F 상호작용</span><button id="interact" class="primary">마왕에게 말 걸기 · F</button></div>
<div id="beauty" hidden><div class="beautyTop"><span id="phaseName"></span><button id="requestAgain">부탁 다시 듣기</button></div><aside id="request"><b>손님의 부탁</b><ul id="requirements"></ul><span id="satisfaction">미용 만족도 · 불만족</span></aside><canvas id="portrait" width="320" height="350" aria-label="마왕 미용 작업 영역"></canvas><div id="reaction" role="status" hidden></div><div class="beautyBottom"><nav id="tools" aria-label="미용 도구"></nav><div class="brush"><label>도구 크기 <input id="size" type="range" min="1" max="20" value="7"></label><button id="undo">되돌리기</button><button id="clearStickers">장식 떼기</button></div><div id="colors" aria-label="그리기 색상"></div><div id="stickers"></div><button id="finish" class="primary">미용 완료</button></div></div>
<div id="battleUI" hidden><div><b id="battlePhase"></b><span>체력 <progress id="hp" max="100"></progress></span><span>무력화 <progress id="stagger" max="100"></progress></span></div><p id="battleHint">위험 구역을 피하면서 마왕을 클릭하세요.</p></div>
<div id="ending" hidden></div></section><footer><span id="hint">문을 열면 약속한 손님이 찾아옵니다.</span><span>YACHACHA · DAY 04</span></footer></main>
<script type="module" src="demon.js"></script></body></html>
